name: Marmara Duyuru Takip Botu

on:
  schedule:
    # Türkiye UTC+3 kullanıyor ve DST uygulamıyor, bu yüzden 09:17 TR = 06:17 UTC
    # her zaman geçerli (mevsimsel kaymaya gerek yok). Saat başları GitHub'ın en
    # yoğun anı: "0 6" ile çalıştırmalar 4-7 saat gecikip 13:14-16:30 TR arasında
    # başlıyordu. GitHub'ın önerisi saat başı dışında bir dakika seçmek.
    - cron: "17 6 * * *"
  workflow_dispatch: {} # Gerektiğinde elle tetiklemek için

# GITHUB_TOKEN'ın duyurular.json değişikliğini repoya push edebilmesi için.
permissions:
  contents: write

concurrency:
  group: marmara-duyuru-botu
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Python'u kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Duyuruları kontrol et ve Telegram bildirimi gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: duyurular.json değişikliğini repoya commit'le
        # main.py Telegram'a mesaj gönderemeyince hata koduyla biter (GitHub
        # e-posta atsın diye); gönderilemeyen duyurular yine de kaydedilmeli.
        if: success() || failure()
        run: |
          git config user.name "marmara-duyuru-bot"
          git config user.email "actions@github.com"
          git add duyurular.json
          if git diff --cached --quiet; then
            echo "duyurular.json değişmedi, commit atılmıyor."
          else
            git commit -m "chore: duyurular.json güncellendi [skip ci]"
            git pull --rebase origin main
            git push
          fi
